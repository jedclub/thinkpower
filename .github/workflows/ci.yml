name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & PGO Benchmark (Ubuntu)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libglib2.0-dev

      - name: Build with PGO and x86-64-v3 (AVX2/FMA/BMI2)
        run: |
          make pgo MARCH=x86-64-v3 MTUNE=generic

      - name: Verify Binary & Properties
        run: |
          ls -lh bin/power-tray
          file bin/power-tray
          ./bin/power-tray --train

      - name: Run Regression Prevention Test Suite
        run: |
          sudo apt-get install -y desktop-file-utils
          make test

      - name: Build Debian Package (.deb)
        run: |
          ./packaging/build-deb.sh 1.1.0 amd64
          ls -lh release/*.deb

  build-arch-package:
    name: Build Pacman Package (Arch / CachyOS)
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pacman build dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            git \
            gtk3 \
            libayatana-appindicator \
            glib2 \
            sudo

      - name: Build Arch package via makepkg
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder:builder .
          su builder -c "makepkg -f --nodeps"
          ls -lh *.pkg.tar.zst
